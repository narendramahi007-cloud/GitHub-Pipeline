name: Terraform CI/CD on Azure

on: 
  push:
    branches:
      - main
      - "feature/**"

# Azure लॉगिन और परमिशन के लिए सेटिंग्स
permissions:
  id-token: write
  contents: read

jobs:
  terraform-azure:
    name: Terraform Plan & Apply for Azure
    runs-on: ubuntu-latest

    steps:
      # Step 1: कोड क्लोन करन
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Azure Login (वास्तविक वैल्यूज के साथ सीधे Hardcoded)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Step 3: Terraform सेटअप करना
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        

      # Step 4: Terraform Init (Parent_Module के अंदर)
      - name: Terraform Init
        run: terraform init
        working-directory: Parent_Module

      # Step 5: Terraform Validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: Parent_Module

      # Step 6: Terraform Plan (यह Feature branch और Main दोनों पर चलेगा)
      - name: Terraform Plan
        id: plan
        run: terraform plan
        working-directory: Parent_Module

      # Step 7: Terraform Apply (यह केवल 'main' ब्रांच पर पुश होने पर चलेगा)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
        working-directory: Parent_Module